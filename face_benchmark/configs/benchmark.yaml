# ============================================================
# Kinetic HR
# Face Recognition Benchmark Configuration
# ============================================================

# ------------------------------------------------------------
# Default model
# ------------------------------------------------------------

default_model: buffalo_l


# ------------------------------------------------------------
# Available models
# ------------------------------------------------------------

models:

  buffalo_l:
    enabled: true

  antelopev2:
    enabled: true

  japanese_face_v1:
    # JapaneseFaceAdapter が完成するまでは false
    enabled: false


# ------------------------------------------------------------
# Runtime model
#
# factory.pyとの互換性維持用。
# 実際のUIモデル切替時にはModelServiceがここを書き換える。
# ------------------------------------------------------------

model:
  name: buffalo_l


# ------------------------------------------------------------
# Device
# ------------------------------------------------------------

device:

  providers:
    - CUDAExecutionProvider
    - CPUExecutionProvider


# ------------------------------------------------------------
# Face Detection
# ------------------------------------------------------------

detection:

  width: 640
  height: 640


# ------------------------------------------------------------
# Enrollment
# ------------------------------------------------------------

registration:

  capture_count: 5


# ------------------------------------------------------------
# Face Recognition
# ------------------------------------------------------------

recognition:

  # 現段階では暫定値。
  # 最終Thresholdは実測結果からモデル別に決定する。
  threshold: 0.50


# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------

storage:

  embedding_root: data/embeddings


# ------------------------------------------------------------
# Benchmark
# ------------------------------------------------------------

benchmark:

  results_root: results